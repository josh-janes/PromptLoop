# PromptLoop - Docker Compose
# Orchestrates all services for local development

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: live_guitar
      POSTGRES_PASSWORD: ${DB_PASSWORD:-development}
      POSTGRES_DB: live_guitar_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U live_guitar" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Rails API Backend
  web-service:
    build:
      context: ./web-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://live_guitar:${DB_PASSWORD:-development}@db:5432/live_guitar_development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-secret-key}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web-service:/app
      - bundle_cache:/usr/local/bundle

  # React Frontend (development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      # VITE_AI_SERVICE_URL removed (AI is now browser-based)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web-service

volumes:
  postgres_data:
  bundle_cache:
